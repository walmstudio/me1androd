
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">

    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <title>ME1PORT</title>
    

    <link rel="stylesheet" href="style/main.css">
</head>

<body>
    <script src="js/translations.js"></script>
    <!-- Фоновое видео -->
    <video class="background-video"
           autoplay
           muted
           loop
           playsinline
           preload="auto">

        <source src="attractmovie.webm" type="video/webm">

    </video>

    <!-- Затемнение -->
    <div class="background-overlay"></div>

    <!-- Контент сайта -->
    <div class="site-content">
    
        <main>
            <div class="hero-frame">

            <div class="language-switcher">
                <button type="button" onclick="setLanguage('en')" title="English">🇬🇧</button>
                <button type="button" onclick="setLanguage('ru')" title="Русский">🇷🇺</button>
                <button type="button" onclick="setLanguage('de')" title="Deutsch">🇩🇪</button>
                <button type="button" onclick="setLanguage('fr')" title="Français">🇫🇷</button>
                <button type="button" onclick="setLanguage('it')" title="Italiano">🇮🇹</button>
                <button type="button" onclick="setLanguage('es')" title="Español">🇪🇸</button>
                <button type="button" onclick="setLanguage('pl')" title="Polski">🇵🇱</button>
                <button type="button" onclick="setLanguage('cs')" title="Čeština">🇨🇿</button>
                <button type="button" onclick="setLanguage('hu')" title="Magyar">🇭🇺</button>
            </div>
                <h1 data-i18n="title">
                    Mass Effect 1 Port for Android
                </h1>

                <p data-i18n="description">
                    Experience the legendary universe of Mass Effect 1.
                </p>
                
                <!-- Основные кнопки -->
                <div class="action-buttons">
                    <a href="#" class="action-button" data-i18n="download">Скачать</a>
                    <a href="#" class="action-button" data-i18n="cache">Кэш игры</a>
                    <a href="doc/me1.pdf" class="action-button" data-i18n="documentation">Документация</a>
                </div>

                <!-- Фрейм WALM -->
                <div class="walm-frame">
                    <a href="https://walmstudio.github.io/site" class="walm-button">
                        <img src="images/walm.png" alt="WALM Logo">
                        <span>by WALM</span>
                    </a>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
